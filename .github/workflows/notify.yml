on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      event_name:
        required: true
        type: string
      pr_url:
        required: false
        type: string
      pr_title:
        required: false
        type: string
      commit_msg:
        required: false
        type: string
    secrets:
      MATTERMOST_WEBHOOK_URL:
        required: true
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Push: plain text with commit message, author, and link
      - name: Notify Commit
        if: inputs.event_name == 'push'
        run: |
          curl -X POST -H 'Content-Type: application/json' \
          -d "{\"text\": \"Commit: [${COMMIT_MSG}](${COMMIT_URL}) by ${ACTOR}\"}" \
          "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          COMMIT_MSG: ${{ inputs.commit_msg }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      # PR: colored box with title and link (Mattermost)
      - name: Notify PR
        if: inputs.event_name == 'pull_request'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          SLACK_USERNAME: 'Satsavi CI/CD'
          SLACK_TITLE: ${{ inputs.pr_title }}
          SLACK_MESSAGE: ${{ inputs.pr_url }}
          SLACK_COLOR: '#36a64f'

      # Release: colored box with deployment info
      - name: Notify Deployment
        if: inputs.event_name == 'release'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          SLACK_USERNAME: 'Satsavi CI/CD'
          SLACK_TITLE: 'Deployment: ${{ github.repository }}'
          SLACK_MESSAGE: >-
            Commit: "${{ inputs.commit_msg }}"
            Status: ${{ inputs.status }} on ${{ github.ref_name }}
          SLACK_COLOR: ${{ inputs.status == 'success' && '#36a64f' || '#af111c' }}

      # =========================================================================
      # Spark PR Sync: Extract diff and email to Gmail for automated review
      # =========================================================================
      - name: Check SMTP Configuration
        id: smtp_check
        if: inputs.event_name == 'pull_request'
        env:
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
        run: |
          if [ -n "$SMTP_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout caller repo
        if: inputs.event_name == 'pull_request' && steps.smtp_check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR diff
        if: inputs.event_name == 'pull_request' && steps.smtp_check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Try gh pr diff if API permission is available
          if [ -n "${{ inputs.pr_url }}" ] && gh pr diff "${{ inputs.pr_url }}" > pr_diff.txt 2>/dev/null; then
            echo "Diff generated via gh pr diff"
          # 2. Fallback to pure git diff against base branch (no pull-requests permission required)
          else
            BASE_BRANCH="${{ github.base_ref || 'main' }}"
            echo "Falling back to git diff against origin/$BASE_BRANCH"
            git fetch origin "$BASE_BRANCH" --depth=50 || true
            git diff "origin/$BASE_BRANCH...HEAD" > pr_diff.txt || true
          fi

      - name: Send PR Diff to Gmail for Spark
        if: inputs.event_name == 'pull_request' && steps.smtp_check.outputs.enabled == 'true' && hashFiles('pr_diff.txt') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[PR-Review] ${{ github.repository }}: ${{ inputs.pr_title }}"
          to: ${{ secrets.SMTP_USERNAME }}
          from: "GitHub CI <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Repository: ${{ github.repository }}
            Pull Request: ${{ inputs.pr_url }}
            Title: ${{ inputs.pr_title }}
            Author: ${{ github.actor }}

            
            ${{ github.event.pull_request.body }}
          attachments: pr_diff.txt